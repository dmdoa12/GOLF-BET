<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>골프 내기 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ec; --paper:#ffffff; --ink:#15211a; --mut:#66736b; --line:#d8ddd6;
  --green:#1b4a33; --green2:#e1ece4; --flag:#d9a520; --flagbg:#fbf1d4;
  --red:#b83c28; --redbg:#f8e3de; --blue:#245b8f; --bluebg:#e0ebf5;
  --barbg:#1b4a33;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --paper:#18211c; --ink:#e8eee9; --mut:#8d9a92; --line:#2b3831;
    --green:#5fb485; --green2:#1d3327; --flag:#e6b93e; --flagbg:#3a3015;
    --red:#e2735f; --redbg:#3d201a; --blue:#78aee0; --bluebg:#18293a;
    --barbg:#10271b;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --paper:#18211c; --ink:#e8eee9; --mut:#8d9a92; --line:#2b3831;
  --green:#5fb485; --green2:#1d3327; --flag:#e6b93e; --flagbg:#3a3015;
  --red:#e2735f; --redbg:#3d201a; --blue:#78aee0; --bluebg:#18293a;
  --barbg:#10271b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}

/* settlement bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--barbg);color:#fff;margin:0 -14px;padding:12px 14px 12px}
.bar .top{font-size:13px;opacity:.85;padding:0 2px;display:flex;gap:8px}
.bar .savest{margin-left:auto;font-size:11px;opacity:.8;white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;margin-top:8px}
.tile{background:rgba(255,255,255,.1);border-radius:9px;padding:6px 6px 7px;min-width:0}
.tile .nm{font-size:12px;opacity:.85}
.tile .v{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.tile .v.up{color:#a9e8c2} .tile .v.dn{color:#ffb7a8}
.tile .v{white-space:nowrap}
.board.n4 .tile .v{font-size:15px}
.board.n4 .tile .v i{display:none}
.tile .v i{font-style:normal;font-size:11px;font-weight:500;opacity:.8;margin-left:1px}
.tile.lead{background:rgba(255,255,255,.2)}
.bar .sub{font-size:12px;opacity:.75;margin-top:8px;padding:0 2px}

/* hole chips */
.chips{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:14px 0 12px}
.chip{position:relative;height:38px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-weight:500;font-size:15px}
.chip.done{background:var(--green2);border-color:transparent}
.chip.half{border-color:var(--flag);border-style:dashed}
.chip.cur{outline:2px solid var(--green);outline-offset:-2px}
.chip .x{position:absolute;top:-6px;right:-3px;font-size:10px;font-weight:700;background:var(--flag);color:#2a2000;border-radius:6px;padding:0 4px;line-height:15px}

/* hole card */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hno{font-size:26px;font-weight:700;letter-spacing:-.02em}
.hno small{display:block;font-size:13px;font-weight:500;color:var(--mut);letter-spacing:0;margin-top:-2px}
.pars{display:flex;gap:4px}
.pars button{width:52px;height:34px;border-radius:8px;border:1px solid var(--line);font-size:14px}
.pars button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mult{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:14px;background:var(--bg);color:var(--mut)}
.mult.hot{background:var(--flagbg);color:var(--ink);font-weight:700}
.mult.hot b{color:var(--flag)}
.mult.warn{background:var(--redbg);color:var(--red)}
.mult .jump{margin-left:4px;padding:0 4px;text-decoration:underline;font-weight:700}

.pls{margin-top:12px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:16px}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button.pm{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);font-size:22px;line-height:1}
.step button.pm:active{background:var(--green2)}
.step button.pm:disabled{opacity:.3;cursor:default}
.val{min-width:60px;text-align:center;border-radius:10px;padding:0 2px}
.val b{display:block;font-size:28px;line-height:1.1}
.val small{display:block;font-size:11px;color:var(--mut);white-space:nowrap}
.val.bir small{color:var(--blue);font-weight:700}
.val.tri small{color:var(--red);font-weight:700}
.tags{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.tag{height:28px;padding:0 6px;border-radius:14px;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.tag .cnt{font-size:10px;margin-left:1px;vertical-align:1px}
.tag.on{background:var(--redbg);border-color:var(--red);color:var(--red);font-weight:700}

.teams{margin-top:12px;display:grid;gap:8px}
.vs{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.vs > span{min-width:0}
.vs b{color:var(--mut);font-weight:500}
.redraw.ghost{background:none;color:var(--green);border:1px solid var(--line);margin-left:auto}
.redraw.ghost + .redraw{margin-left:0}
details.fix{border:0;margin:0;background:none;border-radius:0}
details.fix summary{padding:2px 0;font-size:13px;font-weight:500;color:var(--mut)}
details.fix[open]{display:grid;gap:8px}
.grp{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px}
.grph{font-size:14px;font-weight:700;color:var(--ink)}
.prizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.prizes label{display:flex;align-items:center;gap:4px}
.prizes label span{width:30px;flex:none;font-size:12px}
.set .prizes input{height:36px;padding:0 6px;font-size:14px}
.ghostbtn{height:38px;border-radius:8px;border:1px solid var(--line);font-size:14px;color:var(--green);font-weight:700}
.psum{font-size:13px;color:var(--mut)}
.psum.bad{color:var(--red);font-weight:700}
.inl{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}
.redraw{margin-left:auto;height:32px;padding:0 12px;border-radius:16px;background:var(--green);color:#fff;font-size:13px;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .redraw{color:#0f1512}}
:root[data-theme="dark"] .redraw{color:#0f1512}
.tm{display:inline-block;font-style:normal;font-size:11px;font-weight:700;line-height:18px;padding:0 5px;border-radius:5px;margin-right:5px;vertical-align:2px}
.tm.tr{background:var(--redbg);color:var(--red)}
.tm.tg{background:var(--green2);color:var(--green)}
.tm.oe{background:#2b3f8f;color:#fff;margin-left:5px;margin-right:0;font-size:10px}
.tile .oecd{font-size:9px;font-weight:700;background:#fff;color:#1b4a33;border-radius:4px;padding:0 3px;margin-left:4px;vertical-align:1px}
.tm.jk{background:var(--ink);color:var(--paper);margin-left:5px;margin-right:0}
.nmlink{cursor:pointer}
.namehint{display:block;width:100%;margin:12px 0 0;padding:10px 12px;border-radius:10px;border:1px dashed var(--green);color:var(--green);font-size:14px;font-weight:700;background:var(--paper)}
.tile{cursor:pointer}
.settle .sec{border-top:0;padding-top:12px;font-weight:700;color:var(--ink)}
.settle .sec small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.settle .row.sec + .row{border-top:0}
.res .line.team{padding-bottom:6px;margin-bottom:3px;border-bottom:1px solid var(--line)}
td small.pr{color:var(--mut)}
.bonus{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.brow{display:flex;align-items:center;gap:10px}
.brow > span{width:34px;flex:none;font-size:14px;color:var(--mut)}
.seg{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{height:36px;font-size:13px;border-left:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--green);color:#fff;font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{color:#0f1512}}
:root[data-theme="dark"] .seg button.on{color:#0f1512}

.res{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px}
.res .line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:3px 0}
.res .line .who{min-width:0}
.res .line small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.res .line .who.ell{white-space:normal}
.res .line .num{font-weight:700;flex:none}
.res .next{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--mut)}
.res .next.hot{color:var(--ink);font-weight:700}
.pos{color:var(--green)} .neg{color:var(--red)}

.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1;height:48px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-weight:500}
.nav button.primary{background:var(--green);color:#fff;border-color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav button.primary{color:#0f1512}}
:root[data-theme="dark"] .nav button.primary{color:#0f1512}
.nav button:disabled{opacity:.35;cursor:default}
.clear{display:block;margin:10px auto 0;padding:6px 10px;font-size:13px;color:var(--mut);text-decoration:underline}

h2{font-size:17px;margin:28px 0 10px}
.settle{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.settle .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.settle .row:first-child{border-top:0}
.settle .row b{font-weight:700}
.settle .empty{color:var(--mut);font-size:14px;padding:9px 0}
.settle .pot{border-top:1px dashed var(--line);align-items:baseline}
.settle .pot small{display:block;color:var(--mut);font-size:12px}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;background:var(--bg);max-width:72px;overflow:hidden;text-overflow:ellipsis}
td small{display:block;font-size:10.5px;line-height:1.2;letter-spacing:-.02em}
tr.sum td.num{font-size:12px;letter-spacing:-.02em}
tr.sum td{font-weight:700;background:var(--green2)}
tr.click{cursor:pointer}
tr.cur td{background:var(--bg)}
td.m2{color:var(--flag);font-weight:700}

details{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-top:20px}
summary{padding:14px 16px;font-weight:700;cursor:pointer}
.set{padding:0 16px 16px;display:grid;gap:12px}
.set label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.set input,.set select{width:100%;min-width:0;height:42px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rules{font-size:13px;color:var(--mut);line-height:1.6;margin:0}
.danger{height:44px;border-radius:8px;border:1px solid var(--red);color:var(--red);font-weight:700}
.danger.arm{background:var(--red);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);padding:10px 12px 10px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.toast button{color:var(--flag);font-weight:700;padding:4px 6px;white-space:nowrap;flex:none}
.toast span{min-width:0}

/* ---- 스틱 뽑기 애니메이션 ---- */
.dov{position:fixed;inset:0;z-index:20;background:rgba(8,14,11,.82);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.dbox{width:100%;max-width:400px;text-align:center;color:#fff}
.dtitle{font-size:18px;font-weight:700}
.dsub{font-size:13px;opacity:.7;margin-top:2px}
.cup{position:relative;width:150px;height:330px;margin:0 auto;perspective:700px}
.cupin{position:absolute;inset:0;transform:rotateX(14deg);transform-origin:50% 100%}
.cup-back{position:absolute;left:10px;right:10px;bottom:118px;height:30px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#0c0806 0%,#1d140d 55%,#3a2818 100%);box-shadow:inset 0 6px 10px rgba(0,0,0,.8)}
.cup-front{position:absolute;z-index:10;left:10px;right:10px;bottom:0;height:133px;border-radius:0 0 24px 24px/0 0 16px 16px;
  background:linear-gradient(90deg,#2a1c11 0%,#6b4a2c 18%,#b8875a 38%,#d9ab79 44%,#8d6440 62%,#4a3220 85%,#22170e 100%);
  box-shadow:0 18px 28px rgba(0,0,0,.55),inset 0 -10px 18px rgba(0,0,0,.35)}
.cup-front::before{content:"";position:absolute;left:0;right:0;top:-15px;height:30px;border-radius:50%;
  border-bottom:6px solid #c99766;box-shadow:0 3px 0 #7a5535}
.cup-front::after{content:"";position:absolute;left:0;right:0;bottom:22px;height:10px;background:linear-gradient(90deg,#1d130b,#5b3e25 40%,#8a6240 45%,#3b2817 70%,#1d130b);opacity:.8}
.stk{position:absolute;bottom:40px;left:50%;width:13px;height:180px;margin-left:-6.5px;border-radius:7px;
  background:linear-gradient(90deg,#8a6439 0%,#d9b47f 30%,#f6e3bf 42%,#c49a64 65%,#7a552e 100%);
  box-shadow:1px 2px 4px rgba(0,0,0,.45);transform-origin:50% 100%;transform:translateX(var(--x)) rotate(var(--r))}
.stk .tip{position:absolute;left:0;right:0;bottom:0;height:54px;border-radius:0 0 7px 7px;font:700 11px/1 sans-serif;color:#f5d36b;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.t-r{background:linear-gradient(90deg,#6e140e,#d63a2e 35%,#ff8f80 45%,#b5281e 70%,#5c100b)}
.t-g{background:linear-gradient(90deg,#0d3d22,#23934f 35%,#7fe0a5 45%,#1b7a40 70%,#0b331c)}
.t-j{background:linear-gradient(90deg,#111,#3b3b3b 38%,#7a7a7a 45%,#2a2a2a 70%,#0c0c0c)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.slot{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 4px;min-height:84px;transition:background .2s}
.slot.now{background:rgba(255,255,255,.2)}
.slot .sn{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .mini{width:44px;height:12px;border-radius:6px;margin:8px auto 6px}
.slot .mini:not(.t-r):not(.t-g):not(.t-j){background:rgba(255,255,255,.15)}
.slot .sr{font-size:12px;min-height:16px;opacity:.9}
.slot.done .mini{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.dwin{margin-top:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.12);font-size:16px;animation:pop .4s ease-out}
.drawbig{width:100%;height:52px;border-radius:12px;background:var(--green);color:#fff;font-size:17px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .drawbig{color:#0f1512}}
:root[data-theme="dark"] .drawbig{color:#0f1512}
.drawhint{font-size:12px;color:var(--mut);text-align:center}
.dres{min-height:44px;margin-top:12px;font-size:15px;font-weight:700;line-height:1.5}
.dres .tm{vertical-align:1px}
.dok{margin-top:10px;width:100%;height:48px;border-radius:12px;background:#fff;color:#15211a;font-weight:700;font-size:16px;opacity:0;pointer-events:none;transition:opacity .25s}
.dok.show{opacity:1;pointer-events:auto}
.dskip{font-size:12px;opacity:.55;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div id="main"></div>
  <details id="setbox">
    <summary>설정 · 규칙</summary>
    <div class="set" id="settings"></div>
  </details>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">되돌리기</button></div>
<script>
const KEY='golf-bet-v1';
const MAXP=4, DEF_N=4, DEF_NAMES=['A','B','C','D'];
// 코스별 9홀 파. 젠스필드CC(충북 음성, 파72): 드래곤(OUT) 36 + 힐(IN) 36
const DRAGON=[4,4,5,4,3,5,4,3,4], HILL=[4,5,4,4,3,4,4,3,5];
const COURSES={
  zdh:{name:'젠스필드 드래곤 → 힐',nines:[['드래곤',DRAGON],['힐',HILL]]},
  zhd:{name:'젠스필드 힐 → 드래곤',nines:[['힐',HILL],['드래곤',DRAGON]]},
  std:{name:'기본 코스',nines:[['',[4,4,3,4,5,4,3,4,5]],['',[4,3,4,5,4,4,3,5,4]]]},
};
const DEF_COURSE='zdh';
const coursePars=id=>[...COURSES[id].nines[0][1],...COURSES[id].nines[1][1]];
function holeSub(i){const [n]=COURSES[st.course].nines[i<9?0:1];return n?`${n} ${i%9+1}번`:'';}
const fill=v=>Array(MAXP).fill(v);
const P=()=>[...Array(st.n).keys()];           // 이번 라운드 참가자 인덱스
function blankHole(par){return{par,s:fill(null),t:fill(false),ob:fill(0),bk:fill(0),hz:fill(0),tp:fill(0),long:-1,near:-1,pair:0,joker:-1,c0:0,sticks:null,left:null}}
function blank(course=DEF_COURSE){return{n:DEF_N,names:[...DEF_NAMES],unit:1000,bonus:5000,fine:2000,potMode:'pot',fineRule:'all',fineCap:0,mode:'stroke',stakes:fill(45000),prizeMode:'even',prizes:Array(18).fill(0),cur:0,course,holes:coursePars(course).map(blankHole)}}
const touched=h=>h.t.some(Boolean);
// 코스 적용: force면 모든 홀 파 변경, 아니면 스코어를 직접 입력한 홀은 건드리지 않음. 기본값 스코어는 새 파를 따라감
function applyCourse(id,force){
  st.course=id;
  coursePars(id).forEach((par,i)=>{
    const h=st.holes[i];if(!force&&touched(h))return;
    h.par=par;h.s.forEach((v,k)=>{if(!h.t[k]&&v!=null)h.s[k]=par;});clampHole(h);
  });
}

// 저장본 검증 + 누락 필드 보정 (예전 2인용 저장본이나 깨진 값으로 화면이 죽지 않도록)
function normalize(raw){
  const d=blank();
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.holes)||raw.holes.length!==18)return d;
  const num=(v,def)=>Number.isFinite(+v)&&+v>=0?+v:def;

const won=n=>Math.round(Math.abs(n)).toLocaleString('ko-KR')+'원';

const isOECD=()=>st.fineRule==='oecd';
function rnd(m){try{return crypto.getRandomValues(new Uint32Array(1))[0]%m;}catch(e){return Math.floor(Math.random()*m);}}
// 스틱 5개(빨강2·초록2·조커1) 중 4명이 하나씩 뽑는다. 조커를 뽑은 사람은 한 명 모자란 색 편에 들어가고 타수는 보기로 계산.
// 조커가 남으면(아무도 안 뽑으면) 색깔대로 편.
let pendingAnim=false;
function drawSticks(h){
  const sticks=['r','r','g','g','j'];
  for(let i=sticks.length-1;i>0;i--){const j=rnd(i+1);[sticks[i],sticks[j]]=[sticks[j],sticks[i]];}
  const got=sticks.slice(0,4), jk=got.indexOf('j');
  h.sticks=[...got];h.left=sticks[4];
  const col=[...got];

  h.joker=jk;
  h.c0=col[0]==='r'?0:1;

  h.pair=[1,2,3].find(k=>col[k]===col[0]);
}
const teamOf=(h,k)=>k===0||k===h.pair?0:1;
// 팀 색: 0번 플레이어 편의 색(c0)과 반대편 색
const COLOR=[{nm:'빨강',cl:'tr'},{nm:'초록',cl:'tg'}];
const tcol=(h,t)=>t===0?(h.c0|0):1-(h.c0|0);
const tname=(h,t)=>COLOR[tcol(h,t)].nm;
const badge=(h,t)=>`<i class="tm ${COLOR[tcol(h,t)].cl}">${tname(h,t)}</i>`;
// 판돈·상금: 판돈은 사람마다 다르게, 홀 상금은 균등(판돈 합계÷18) 또는 홀별 직접 입력
const potTotal=()=>P().reduce((a,k)=>a+st.stakes[k],0);
const prizeOf=i=>st.prizeMode==='manual'?(st.prizes[i]||0):potTotal()/18;
const prizeSum=()=>[...Array(18).keys()].reduce((a,i)=>a+prizeOf(i),0);
// 각자 홀 상금에 보태는 몫 = 판돈 비율만큼
const shareOf=k=>{const T=potTotal();return T>0?st.stakes[k]/T:1/st.n;};
const effScore=(h,k)=>isDraw()&&h.joker===k?h.par+1:h.s[k];
const teamNames=(h,t)=>P().filter(k=>teamOf(h,k)===t).map(k=>st.names[k]).join('·');
function label(s,par,auto){
  if(s==null)return'미입력';

  if(s===1)return'홀인원';

}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}

// 정산(스트로크): 모든 두 사람끼리 (타수 차 × 타당 × 배수)를 주고받는 것과 같다.
// k의 타수 몫 = 타당×배수×Σ(상대 타수 − 내 타수). 버디/롱기/니어는 나머지 전원이 각각 보너스를 낸다.
// OB·벙커·해저드 벌금은 배수와 상관없이 1회당 고정 금액. 공금 적립이면 공금(캐디피 등)으로, 아니면 나머지 전원에게 각각 낸다.
// 배판: 더블파나 버디(이하)가 한 명이라도 나오면 다음 홀 ×2 (누적 없음, 배배판 없음).
function compute(){
  const n=st.n,ks=P();
  const rows=[];let mult=1,broken=false,firstGap=-1,carry=0;
  const total=fill(0).slice(0,n), potBy=fill(0).slice(0,n), prizeTot=fill(0).slice(0,n), sideTot=fill(0).slice(0,n);
  // OECD 회원: 뽑기는 받은 상금이 낸 판돈 이상, 스트로크는 지금까지 딴 돈이 플러스(벌금 제외)
  const memberOf=k=>isDraw()?(st.stakes[k]>0&&prizeTot[k]>=st.stakes[k]):(total[k]+potBy[k]>0);
  st.holes.forEach((h,i)=>{
    const done=ks.every(k=>h.s[k]!=null)&&(!isDraw()||h.pair>0);
    const r={i,mult:broken?null:mult,done,counted:false,half:!done&&ks.some(k=>h.s[k]!=null)};
    if(!done||broken){ if(!done&&!broken){broken=true;firstGap=i;} rows.push(r); return; }
    const S=ks.reduce((a,k)=>a+h.s[k],0);
    const bir=ks.map(k=>h.s[k]<=h.par-1?1:0), nb=bir.reduce((a,b)=>a+b,0);
    const win=w=>k=>w<0||w>=n?0:(k===w?n-1:-1);
    if(isDraw()){
      // 뽑기: 홀 상금(판돈에서 나옴)을 타수 합이 적은 편 두 명이 반씩 가져간다. 각자 상금에 보탠 몫은 판돈 비율대로.
      // 조커는 보기로 계산. 동타면 상금이 다음 홀로 이월, 18번 홀까지 동타면 판돈 비율대로 돌려받음.
      const T=[0,0];ks.forEach(k=>T[teamOf(h,k)]+=effScore(h,k));
      const pool=prizeOf(i)+carry, w=T[0]<T[1]?0:T[0]>T[1]?1:-1;
      r.teams=T;r.win=w;r.pool=pool;r.carryIn=carry;
      r.prize=ks.map(k=>w<0?(i===17?pool*shareOf(k):0):(teamOf(h,k)===w?pool/2:0));
      carry=w<0&&i<17?pool:0;
      r.carryOut=carry;
      r.contrib=ks.map(k=>prizeOf(i)*shareOf(k));
      r.stroke=ks.map(k=>r.prize[k]-r.contrib[k]);
    }else r.stroke=ks.map(k=>st.unit*mult*(S-n*h.s[k]));
    r.bir=ks.map(k=>st.bonus*(n*bir[k]-nb));
    r.lng=ks.map(win(h.long)).map(x=>x*st.bonus);
    r.nr=ks.map(win(h.near)).map(x=>x*st.bonus);
    // 벌금. OECD 룰이면 이 홀 시작 시점에 본전 이상 딴 사람(회원)만, OB·벙커·해저드·3퍼트·트리플보기 이상에 낸다
    const oecd=isOECD();
    r.member=ks.map(k=>oecd?memberOf(k):true);
    const fc=ks.map(k=>!r.member[k]?0:h.ob[k]+h.bk[k]+h.hz[k]+(oecd?h.tp[k]+(h.s[k]>=h.par+3?1:0):0));
    const fa=fc.map(c=>{const v=c*st.fine;return st.fineCap>0?Math.min(v,st.fineCap):v;}), FA=fa.reduce((a,b)=>a+b,0);
    r.fc=fc;r.fa=fa;
    r.fine=ks.map(k=>st.potMode==='pot'?-fa[k]:FA-n*fa[k]);
    r.net=ks.map(k=>r.stroke[k]+r.bir[k]+r.lng[k]+r.nr[k]+r.fine[k]);
    const why=[];
    ks.forEach(k=>{
      const nm=st.names[k];
      if(h.s[k]>=maxS(h))why.push(nm+' 더블파');
      if(h.s[k]<=h.par-1)why.push(nm+' '+(h.s[k]<=h.par-2?'이글':'버디'));
    });
    const next=isDraw()?1:(why.length?2:1);
    r.why=why;r.next=next;r.counted=true;
    ks.forEach(k=>{
      total[k]+=r.net[k];
      if(st.potMode==='pot')potBy[k]+=fa[k];
      if(r.prize)prizeTot[k]+=r.prize[k];
      sideTot[k]+=r.bir[k]+r.lng[k]+r.nr[k]+(st.potMode==='pot'?0:r.fine[k]);

    mult=next;rows.push(r);
  });

}
// 최소 송금 목록: 많이 잃은 사람이 많이 딴 사람에게부터
function transfers(total){
  const give=total.map((v,k)=>({k,v:-v})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const take=total.map((v,k)=>({k,v})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<give.length&&j<take.length){
    const m=Math.min(give[i].v,take[j].v);
    if(m>=0.5)out.push({from:give[i].k,to:take[j].k,amt:m});
    give[i].v-=m;take[j].v-=m;
    if(give[i].v<0.5)i++;if(take[j].v<0.5)j++;
  }
  return out;
}

    }).join('');
    let head='';
    if(r.teams){
      const [a,b]=r.teams,w=r.win;
      head=`<div class="line team"><span class="who ell">${badge(h,0)}${a}타 : ${badge(h,1)}${b}타</span><span>${w<0?(c===17?'동타 · 판돈 비율대로 나눔':`동타 · ${won(r.pool)} 이월`):`${tname(h,w)} 승 · ${won(r.pool)}`}</span></div>`;
    }
    res=`<div class="res">${head}${lines}
      ${c<17&&!isDraw()?`<div class="next ${r.next>=2?'hot':''}">다음 홀 ${r.next>=2?`×${r.next} ${multName(r.next)} (${esc(r.why.join(', '))})`:'기본 ×1'}</div>`:''}
    </div>`;
  }

  const trs=rows.map((R,i)=>{
    const x=st.holes[i];
    return `<tr class="click ${i===c?'cur':''}" data-act="go" data-i="${i}"><td>${i+1}${isDraw()&&x.pair?`<small class="pr">${esc(N[0].slice(0,1))}${esc(N[x.pair].slice(0,1))}</small>`:''}</td><td>${x.par}</td>
      ${isDraw()?`<td>${R.counted?(R.win<0?'<small>이월</small>':badge(x,R.win)):'-'}</td>`:`<td class="num ${R.mult>=2?'m2':''}">${R.mult==null?'-':'×'+R.mult}</td>`}
      ${ks.map(k=>`<td class="num">${x.s[k]??'-'}${R.counted?`<small class="${cls(R.net[k])}">${R.net[k]?sgn(R.net[k]).replace(/원$/,''):'0'}</small>`:''}</td>`).join('')}</tr>`;
  }).join('');
  const sum=(k)=>st.holes.reduce((a,x)=>a+(x.s[k]??0),0);
  const parSum=st.holes.reduce((a,x)=>a+x.par,0);

  // 공금 벌금은 사람끼리 주고받는 돈이 아니므로 송금 계산에서 빼고 따로 보여준다
  const tf=transfers(isDraw()?sideTot:total.map((v,k)=>v+potBy[k]));
  const pd=prizeSum()-potTotal();
  const prizeRows=isDraw()?`<div class="row sec"><span>판돈 상금 <small>판돈 합계 ${won(potTotal())} · 홀 상금 ${st.prizeMode==='manual'?'직접 설정':`홀당 ${won(prizeOf(0))}`}${Math.abs(pd)>=1?` · 상금 합계가 판돈보다 ${won(pd)} ${pd>0?'많음':'적음'}`:''}${carry?` · 이월 중 ${won(carry)}`:''}</small></span></div>
    ${ks.map(k=>`<div class="row"><span class="ell">${esc(N[k])} <small class="inl">판돈 ${won(st.stakes[k])}</small></span><b class="num">상금 ${won(prizeTot[k])}</b></div>`).join('')}
    <div class="row sec"><span>보너스${st.potMode==='each'?'·벌금':''} 정산 <small>사람끼리 주고받을 돈</small></span></div>`:'';
  const settle=prizeRows+(tf.length
    ?tf.map(t=>`<div class="row"><span class="ell">${esc(N[t.from])} → ${esc(N[t.to])}</span><b class="num">${won(t.amt)}</b></div>`).join('')
    :`<div class="empty">${doneCnt?'주고받을 돈이 없습니다':'아직 계산된 홀이 없습니다'}</div>`);
  const potSum=potBy.reduce((a,b)=>a+b,0);
  const pot=potSum?`<div class="row pot"><span>공금 (캐디피 등) <small>${ks.filter(k=>potBy[k]).map(k=>`${esc(N[k])} ${won(potBy[k])}`).join(' · ')}</small></span><b class="num">${won(potSum)}</b></div>`:'';

  document.getElementById('main').innerHTML=`
  <div class="bar">
    <div class="top">${doneCnt}/18홀 · ${esc(COURSES[st.course].name)}<span id="savest" class="savest">${cloud.label()}</span></div>
    <div class="board n${n}" style="--n:${n}">${tiles}</div>
    <div class="sub">${isDraw()?`뽑기 · 판돈 ${won(potTotal())} · ${st.prizeMode==='manual'?'홀 상금 직접 설정':`홀당 ${won(prizeOf(0))}`}`:`타당 ${won(st.unit)}`} · 버디/롱기/니어 ${won(st.bonus)} · ${isOECD()?'OECD 벌금':'벌금'} ${won(st.fine)}</div>
  </div>
  ${N.slice(0,n).every((x,k)=>x===DEF_NAMES[k])?`<button class="namehint" data-act="rename" data-p="0">플레이어 이름 설정하기 (지금 A·B·C·D)</button>`:''}
  <div class="chips">${chips}</div>
  <div class="card">
    <div class="hhead">
      <div class="hno">${c+1}번 홀${holeSub(c)?`<small>${esc(holeSub(c))}</small>`:''}</div>
      <div class="pars">${[3,4,5].map(p=>`<button class="${h.par===p?'on':''}" data-act="setpar" data-v="${p}" aria-pressed="${h.par===p}">Par ${p}</button>`).join('')}</div>
    </div>
    <div class="mult ${multCls}">${multTxt}</div>
    <div class="pls">${pl}</div>
    <div class="bonus">
      <div class="brow"><span>롱기</span><div class="seg" style="--k:${n+1}">${seg('long')}</div></div>
      <div class="brow"><span>니어</span><div class="seg" style="--k:${n+1}">${seg('near')}</div></div>
    </div>
    ${teamBox}
    ${res}
  </div>
  <div class="nav">
    <button data-act="go" data-i="${c-1}" ${c===0?'disabled':''}>이전 홀</button>
    <button class="primary" data-act="go" data-i="${c+1}" ${c===17?'disabled':''}>다음 홀</button>
  </div>
  <button class="clear" data-act="clearhole">이 홀 기본값(파)으로 되돌리기</button>

  <h2>정산</h2>
  <div class="settle">${settle}${pot}</div>

  <h2>스코어카드</h2>
  <div class="tbl"><table>
    <thead><tr><th>홀</th><th>Par</th><th>${isDraw()?'승':'배수'}</th>${ks.map(k=>`<th>${esc(N[k])}</th>`).join('')}</tr></thead>
    <tbody>${trs}
      <tr class="sum"><td>타수</td><td>${parSum}</td><td></td>${ks.map(k=>`<td class="num">${sum(k)||'-'}</td>`).join('')}</tr>
      <tr class="sum"><td>정산</td><td></td><td></td>${ks.map(k=>`<td class="num ${cls(total[k])}">${sgn(total[k]).replace(/원$/,'')}</td>`).join('')}</tr>
    </tbody>
  </table></div>`;
  if(pendingAnim){pendingAnim=false;showDrawAnim(h,true);}
}

// 스틱 뽑기 애니메이션: 결과(h.sticks)는 먼저 정해 두고, 통을 흔든 뒤 한 명씩 스틱을 뽑아 보여준다
let animBusy=false;
async function showDrawAnim(h,auto){
  if(!h.pair||animBusy)return;
  animBusy=true;
  const N=st.names,hi=st.holes.indexOf(h);
  const colOf=k=>tcol(h,teamOf(h,k))===0?'r':'g';
  const tips=h.sticks||P().map(k=>h.joker===k?'j':colOf(k));
  let left=h.left;
  if(!h.sticks||!left){const pool=['r','r','g','g','j'];tips.forEach(t=>{const i=pool.indexOf(t);if(i>=0)pool.splice(i,1);});left=pool[0]||'j';}
  const all=[...tips,left];
  const perm=[0,1,2,3,4];for(let i=4;i>0;i--){const j=rnd(i+1);[perm[i],perm[j]]=[perm[j],perm[i]];}
  const X=[-36,-18,0,18,36],ROT=[-9,-4,0,4,9];
  const sticks=all.map((t,i)=>`<div class="stk" style="--x:${X[perm[i]]}px;--r:${ROT[perm[i]]}deg;z-index:${2+perm[i]%3}"><div class="tip t-${t}">${t==='j'?'J':''}</div></div>`).join('');
  const resTxt=k=>tips[k]==='j'?`조커 → ${COLOR[tcol(h,teamOf(h,k))].nm}`:COLOR[tcol(h,teamOf(h,k))].nm;
  const ov=document.createElement('div');ov.className='dov';ov.setAttribute('role','dialog');ov.setAttribute('aria-label','스틱 뽑기');
  ov.innerHTML=`<div class="dbox">
    <div class="dtitle">${hi+1}번 홀 뽑기</div>
    <div class="dsub">빨강 2 · 초록 2 · 조커 1</div>
    <div class="cup"><div class="cupin"><div class="cup-back"></div>${sticks}<div class="cup-front"></div></div></div>
    <div class="slots">${P().map(k=>`<div class="slot" data-k="${k}"><div class="sn">${esc(N[k])}</div><div class="mini"></div><div class="sr">?</div></div>`).join('')}</div>
    <div class="dres" aria-live="polite"></div>
    <button class="dok" type="button">확인</button>
    <div class="dskip">화면을 누르면 바로 결과를 봅니다</div>
  </div>`;
  document.body.appendChild(ov);
  const stEls=[...ov.querySelectorAll('.stk')],slots=[...ov.querySelectorAll('.slot')],cupin=ov.querySelector('.cupin');
  const ok=ov.querySelector('.dok'),res=ov.querySelector('.dres');
  let skip=false;const running=[];
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim=(el,kf,o)=>{if(skip||reduce||!el.animate)return Promise.resolve();const a=el.animate(kf,o);running.push(a);return a.finished.catch(()=>{});};
  const wait=ms=>skip||reduce?Promise.resolve():new Promise(r=>setTimeout(r,ms));
  const reveal=k=>{
    const sl=slots[k];sl.classList.remove('now');sl.classList.add('done');
    sl.querySelector('.mini').className='mini t-'+tips[k];
    sl.querySelector('.sr').textContent=resTxt(k);
  };
  const finish=()=>{
    P().forEach(reveal);stEls.slice(0,4).forEach(e=>e.style.opacity='0');
    res.innerHTML=`${badge(h,0)}${esc(teamNames(h,0))} &nbsp;vs&nbsp; ${badge(h,1)}${esc(teamNames(h,1))}`+
      (h.joker>=0?`<div style="font-size:13px;font-weight:500;opacity:.85">조커 ${esc(N[h.joker])}: 이 홀은 보기로 계산</div>`:`<div style="font-size:13px;font-weight:500;opacity:.85">조커가 남아서 색깔대로 편</div>`);
    const R=compute().rows[hi];
    if(R&&R.counted&&R.teams){
      const [a,b]=R.teams,w=R.win;
      res.innerHTML+=`<div class="dwin">${badge(h,0)}${a}타 : ${badge(h,1)}${b}타<br>${w<0?(hi===17?'동타 · 상금은 판돈 비율대로 나눔':`동타 · 상금 ${won(R.pool)} 다음 홀로 이월`):`${tname(h,w)} 승 · ${esc(teamNames(h,w))} 각 ${won(R.pool/2)}`}</div>`;
    }
    ok.classList.add('show');ov.querySelector('.dskip').style.visibility='hidden';
  };
  const close=()=>{ov.remove();animBusy=false;};
  ok.addEventListener('click',e=>{e.stopPropagation();close();});
  ov.addEventListener('click',e=>{if(e.target===ok)return;if(!ok.classList.contains('show')){skip=true;running.forEach(a=>{try{a.finish()}catch(_){}});}});
  // 1) 통 흔들기
  await anim(cupin,[{transform:'rotateX(14deg) rotateZ(0)'},{transform:'rotateX(14deg) rotateZ(-7deg) translateX(-6px)'},{transform:'rotateX(14deg) rotateZ(6deg) translateX(6px)'},{transform:'rotateX(14deg) rotateZ(-5deg) translateX(-4px)'},{transform:'rotateX(14deg) rotateZ(4deg) translateX(3px)'},{transform:'rotateX(14deg) rotateZ(0)'}],{duration:900,easing:'ease-in-out'});
  // 2) 한 명씩 뽑기
  for(let k=0;k<4&&!skip;k++){
    slots[k].classList.add('now');
    const el=stEls[k],base=getComputedStyle(el).transform;
    await anim(el,[{transform:base},{transform:base+' translateY(-150px)'}],{duration:450,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
    await wait(180);
    reveal(k);
    await anim(el,[{opacity:1},{opacity:0}],{duration:150,fill:'forwards'});
    el.style.opacity='0';
    await wait(100);
  }
  finish();
}
// 균등 상금: 판돈 합계를 18로 나눠 100원 단위로 맞추고 남는 돈은 18번 홀에
function fillEvenPrizes(){
  const T=potTotal(),each=Math.floor(T/18/100)*100;
  for(let i=0;i<18;i++)st.prizes[i]=each;
  st.prizes[17]+=T-each*18;
}
function updPsum(){
  const el=document.getElementById('psum');if(!el)return;
  const d=prizeSum()-potTotal();
  el.textContent=`판돈 합계 ${won(potTotal())} · 상금 합계 ${won(prizeSum())}`+(Math.abs(d)>=1?` (${won(d)} ${d>0?'초과':'남음'})`:'');
  el.className='psum'+(Math.abs(d)>=1?' bad':'');
}

        ${isDraw()
          ?`뽑기: 각자 판돈을 내고, 홀마다 정해진 상금을 타수 합이 적은 편 두 명이 반씩 가져갑니다.<br>
            홀이 끝나고 스코어를 다 넣은 뒤 "뽑기"를 누르면 스틱 5개(빨강2·초록2·조커1)로 편을 뽑습니다. 조커를 뽑은 사람은 한 명 모자란 색 편이 되고, 실제 타수와 상관없이 보기로 계산합니다. 아무도 조커를 안 뽑으면 색깔대로 편입니다.<br>
            동타면 상금이 다음 홀로 이월되고, 18번 홀까지 동타면 판돈 비율대로 나눕니다.`
          :`스트로크: 홀마다 모든 두 사람끼리 타수 차 × 타당 × 배수를 진 사람이 이긴 사람에게 냅니다.<br>
            더블파나 버디(이글 포함)가 한 명이라도 나오면 다음 홀은 ×2 배판입니다. 배판은 겹치지 않습니다(배배판 없음).`}<br>
        홀마다 더블파(파×2)가 최대 타수입니다.<br>
        ${isOECD()
          ?`OECD 룰: 본전 이상 딴 사람(${isDraw()?'받은 상금이 낸 판돈 이상':'지금까지 딴 돈이 플러스'})만 OECD 회원이 되어 OB·벙커·해저드·3퍼트·트리플보기 이상 1번마다 벌금을 냅니다. 회원이 아니면 벌금이 없습니다. 회원 여부는 홀마다 그 홀 시작 시점 기준으로 다시 정해집니다.`
          :`OB·벙커·해저드는 1번마다 벌금을 냅니다(배수 없음).`} 같은 홀에서 여러 번이면 버튼을 다시 눌러 횟수를 올립니다.${st.fineCap>0?` 한 홀 벌금은 최대 ${won(st.fineCap)}입니다.`:''}<br>
        버디(이글 포함), 롱기, 니어는 배수와 상관없이 나머지 사람이 각각 보너스 금액을 냅니다.
      </p>
      <button class="danger" type="button" data-act="reset">새 라운드 시작 (전체 초기화)</button>`;

  const bind=(id,ev,f,blur)=>{
    const el=document.getElementById(id);
    el.addEventListener(ev,()=>{f(el.value);save();render();});
    if(blur)el.addEventListener('change',()=>{blur(el);});
  };
  // 이름: 입력 즉시 반영, 비우고 나가면 기본 이름 복원
  ks.forEach(k=>bind(`n${k}name`,'input',v=>st.names[k]=v.trim()||DEF_NAMES[k],el=>{el.value=st.names[k];}));
  if(isDraw()){
    ks.forEach(k=>bind(`stake${k}`,'input',v=>{st.stakes[k]=Math.max(0,Math.round(+v)||0);updPsum();},el=>{el.value=st.stakes[k];}));
    bind('prizeMode','change',v=>{st.prizeMode=v==='manual'?'manual':'even';if(st.prizeMode==='manual'&&!st.prizes.some(Boolean))fillEvenPrizes();},()=>renderSettings());
    if(st.prizeMode==='manual')for(let i=0;i<18;i++)bind(`prize${i}`,'input',v=>{st.prizes[i]=Math.max(0,Math.round(+v)||0);updPsum();},el=>{el.value=st.prizes[i];});
    updPsum();
  }else bind('unit','input',v=>st.unit=Math.max(0,Math.round(+v)||0),el=>{el.value=st.unit;});
  bind('bonus','input',v=>st.bonus=Math.max(0,Math.round(+v)||0),el=>{el.value=st.bonus;});
  bind('fine','input',v=>st.fine=Math.max(0,Math.round(+v)||0),el=>{el.value=st.fine;});
  bind('fineCap','input',v=>st.fineCap=Math.max(0,Math.round(+v)||0),el=>{el.value=st.fineCap||'';});
  bind('fineRule','change',v=>st.fineRule=v==='oecd'?'oecd':'all',()=>renderSettings());
  bind('potMode','change',v=>st.potMode=v==='each'?'each':'pot');
  bind('course','change',v=>applyCourse(v,true));
  bind('n','change',v=>{st.n=+v;if(st.n!==4&&st.mode==='draw')st.mode='stroke';},()=>renderSettings());
  bind('mode','change',v=>{st.mode=v==='draw'&&st.n===4?'draw':'stroke';},()=>renderSettings());
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(armed)disarm();return;}
  const a=b.dataset.act,h=st.holes[st.cur],p=+b.dataset.p,v=+b.dataset.v;
  switch(a){
    case 'go':{const i=+b.dataset.i;if(!(i>=0&&i<=17))return;st.cur=i;save();render();
      if(b.tagName==='TR'||b.closest('.mult'))window.scrollTo({top:0,behavior:'smooth'});return;}
    case 's':h.s[p]=h.s[p]==null?h.par+v:Math.max(1,Math.min(maxS(h),h.s[p]+v));h.t[p]=true;break;
    case 'par':h.s[p]=h.par;h.t[p]=true;break;
    case 'setpar':h.par=v;h.s.forEach((x,k)=>{if(!h.t[k]&&x!=null)h.s[k]=v;});clampHole(h);break;
    case 'ob':case 'bk':case 'hz':case 'tp':h[a][p]=(h[a][p]+1)%4;break;
    case 'long':h.long=h.long===v&&v>=0?-1:v;break;
    case 'near':h.near=h.near===v&&v>=0?-1:v;break;
    case 'pair':if(v>=1&&v<=3){h.pair=v;h.sticks=null;}break;
    case 'joker':h.joker=v>=0&&v<4?v:-1;h.sticks=null;break;
    case 'c0':h.c0=v===1?1:0;h.sticks=null;break;
    case 'draw':{
      const had=h.pair>0,snap=JSON.stringify(st);
      drawSticks(h);pendingAnim=true;
      if(had)toast(`다시 뽑았습니다`,snap);break;}
    case 'showdraw':showDrawAnim(h,false);return;
    case 'evenprizes':fillEvenPrizes();save();renderSettings();render();return;
    case 'rename':{
      // 설정을 열고 해당 이름 칸에 바로 커서
      const box=document.getElementById('setbox');box.open=true;
      const el=document.getElementById(`n${p}name`);
      if(el){el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{el.focus();el.select();},300);}
      return;}
    case 'clearhole':{
      const empty=!touched(h)&&!h.ob.some(Boolean)&&!h.bk.some(Boolean)&&!h.hz.some(Boolean)&&!h.tp.some(Boolean)&&h.long<0&&h.near<0;
      if(empty)return;
      const snap=JSON.stringify(st);
      Object.assign(h,blankHole(h.par),{pair:h.pair,joker:h.joker});
      toast(`${st.cur+1}번 홀을 기본값으로 되돌렸습니다`,snap);break;}
    case 'reset':{
      if(!armOrRun(b,'reset','한 번 더 누르면 전체 초기화'))return;
      const snap=JSON.stringify(st);
      const {n,names,unit,bonus,fine,potMode,mode,stakes,prizeMode,prizes,fineRule,fineCap}=st;
      st=blank(st.course);Object.assign(st,{n,names:[...names],unit,bonus,fine,potMode,mode,stakes:[...stakes],prizeMode,prizes:[...prizes],fineRule,fineCap});
      save();renderSettings();render();
      document.getElementById('setbox').open=false;
      window.scrollTo({top:0,behavior:'smooth'});
      toast('새 라운드를 시작했습니다',snap);
      return;}
    default:return;
  }
  save();render();
});
renderSettings();
render();
// 계정 저장(db)은 로그인 창이 떠서 껐다. 기록은 이 기기 브라우저 저장소에만 둔다.
// cloud.init();
</script>
